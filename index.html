<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST BINGO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            border: 2px solid #ffd700;
            object-fit: cover;
        }

        .btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 80%;
            margin: 10px auto;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #0088cc, #005588);
        }

        .balance-card {
            background-color: #1b263b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #415a77;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Fast Bingo Logo" class="logo-img">
    </div>

    <h2>እንኳን ወደ FAST BINGO በደህና መጡ!</h2>

    <div class="balance-card">
        <h3>የእርስዎ ሂሳብ (Balance)</h3>
        <p id="user-balance" style="font-size: 24px; color: #ffd700; font-weight: bold;">0.00 ETB</p>
    </div>

    <button class="btn" onclick="playGame()">🎮 ጨዋታ ጀምር</button>
    <button class="btn btn-secondary" onclick="depositMoney()">📥 ብር አስገባ (Deposit)</button>
    <button class="btn btn-secondary" onclick="withdrawMoney()">📤 ብር አውጣ (Withdraw)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function playGame() {
            alert("ጨዋታው በቅርቡ ይጀምራል!");
        }

        function depositMoney() {
            tg.sendData(JSON.stringify({action: "deposit"}));
        }

        function withdrawMoney() {
            tg.sendData(JSON.stringify({action: "withdraw"}));
        }
    </script>
</body>
</html>
