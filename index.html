<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Bingo Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #ffffff;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Splasht screen (Play button page) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #1e1b4b 0%, #090514 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    .splash-logo-container {
      position: relative;
      margin-bottom: 30px;
    }

    .splash-logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #f59e0b;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), inset 0 0 15px rgba(245, 158, 11, 0.4);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
      100% { transform: scale(1.05); box-shadow: 0 0 40px rgba(245, 158, 11, 0.9), 0 0 60px rgba(239, 68, 68, 0.6); }
    }

    .play-btn-main {
      background: linear-gradient(135deg, #ef4444 0%, #f97316 50%, #eab308 100%);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 16px 60px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      animation: bounce 2s infinite;
    }

    .play-btn-main:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.8);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* Main App Interface */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(to right, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Dashboard Stats */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }

    .dash-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }

    .dash-title { font-size: 0.7rem; color: #94a3b8; font-weight: 600; }
    .dash-value { font-size: 0.95rem; font-weight: 800; color: #38bdf8; margin-top: 2px; }

    /* Action Grid */
    .controls {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px 16px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
    }
    .btn-auto { background: #0284c7; }
    .btn-share { background: #7c3aed; }
    .btn-reset { background: #ea580c; }

    /* Cartela Section */
    .grid-title {
      text-align: center;
      color: #facc15;
      font-size: 1rem;
      font-weight: 800;
      margin: 10px 0;
    }

    .cartela-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 16px 20px 16px;
      flex-grow: 1;
    }

    .cartela-item {
      background: linear-gradient(145deg, #059669, #047857);
      border: 2px solid #34d399;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .cartela-item:active {
      transform: scale(0.92);
    }

    .cartela-item.selected {
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      border-color: #fca5a5;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body>

  <!-- 1. Intro Animated Splash Screen (Play Button) -->
  <div id="splash-screen">
    <div class="splash-logo-container">
      <img src="https://i.ibb.co/L5Z4d7y/fast-bingo-logo.jpg" alt="Fast Bingo Logo" class="splash-logo">
    </div>
    <button class="play-btn-main" onclick="startGame()">ተጫወት (PLAY)</button>
  </div>

  <!-- 2. Main Game Interface -->
  <div class="app-header">
    <div class="brand">
      <img src="https://i.ibb.co/L5Z4d7y/fast-bingo-logo.jpg" class="brand-img" alt="Logo">
      <span class="brand-name">FAST BINGO</span>
    </div>
    <button style="background:#334155; color:white; border:none; padding:6px 12px; border-radius:8px; font-weight:bold;">ሴቲንግ</button>
  </div>

  <div class="dashboard">
    <div class="dash-box">
      <div class="dash-title">WALLET</div>
      <div class="dash-value">0.00 ETB</div>
    </div>
    <div class="dash-box">
      <div class="dash-title">ክፍል</div>
      <div class="dash-value">5 ETB</div>
    </div>
    <div class="dash-box">
      <div class="dash-title">ካርቴል</div>
      <div class="dash-value">0/6</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-auto">🎲 አውቶማቲክ</button>
    <button class="ctrl-btn btn-share">🕹 ሼር</button>
    <button class="ctrl-btn btn-reset">📋 ዢሮ</button>
  </div>

  <div class="grid-title">🎰 ከ 600 ካርቴሎች መርጠው ይጫወቱ</div>

  <div class="cartela-grid" id="grid">
    <!-- Cartelas will be loaded here -->
  </div>

  <script>
    // Initialize Telegram Fullscreen App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Smooth transition when pressing PLAY
    function startGame() {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.visibility = 'hidden';
      }, 600);
    }

    // Populate bold cartela numbers (#1 to #30)
    const gridContainer = document.getElementById('grid');
    for (let i = 1; i <= 30; i++) {
      const btn = document.createElement('div');
      btn.className = 'cartela-item';
      btn.innerText = `#${i}`;
      btn.onclick = function() {
        this.classList.toggle('selected');
      };
      gridContainer.appendChild(btn);
    }
  </script>
</body>
</html>
