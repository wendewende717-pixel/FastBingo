<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Bingo Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Global & Fullscreen Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: #0b1120;
      color: #ffffff;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 20px;
    }

    /* Top Navigation & Logo Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Updated Fast Bingo Logo */
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      border: 2px solid #ef4444;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #f97316, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Status Bar Cards */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 16px;
      background: #1e293b;
      gap: 8px;
    }

    .stat-card {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-orange { background: #f97316; color: #fff; }
    .btn-purple { background: #8b5cf6; color: #fff; }
    .btn-blue { background: #0284c7; color: #fff; }

    /* Section Header */
    .section-title {
      text-align: center;
      margin: 12px 0;
      font-size: 1.1rem;
      color: #facc15;
      font-weight: 800;
    }

    /* Prominent & Bold Cartela Grid */
    .cartela-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .cartela-card {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      padding: 18px 10px;
      border-radius: 14px;
      text-align: center;
      font-size: 1.4rem; /* Prominent Bold Font */
      font-weight: 900;
      border: 2px solid #34d399;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
    }

    .cartela-card:hover {
      background: linear-gradient(135deg, #047857, #059669);
    }

    .cartela-card.selected {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      border-color: #fca5a5;
    }

    /* Bottom Nav Bar */
    .footer-nav {
      margin-top: auto;
      padding: 16px;
      text-align: center;
    }

    .btn-switch {
      background: #334155;
      color: #fff;
      padding: 12px 24px;
      border-radius: 20px;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Top Header with Updated Fast Bingo Logo -->
  <div class="header">
    <div class="brand-container">
      <img src="https://i.ibb.co/L5Z4d7y/fast-bingo-logo.jpg" alt="Fast Bingo Logo" class="brand-logo" id="appLogo">
      <span class="brand-title">FAST BINGO</span>
    </div>
    <button class="btn btn-blue" style="padding: 6px 12px; font-size: 0.8rem;">ሴቲንግ</button>
  </div>

  <!-- Stats Header Bar -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Wallet</div>
      <div class="stat-value">0.00 ETB</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ክፍል</div>
      <div class="stat-value">5 ETB</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ካርቴል</div>
      <div class="stat-value">0/6</div>
    </div>
  </div>

  <!-- Call to Action Buttons -->
  <div class="action-group">
    <button class="btn btn-blue">🎲 አውቶማቲክ መምረጫ</button>
    <button class="btn btn-purple">🕹 ሼር</button>
    <button class="btn btn-orange">📋 ዢሮ</button>
  </div>

  <div class="section-title">🎰 ከ 600 ካርቴሎች መርጠው ይጫወቱ፦</div>

  <!-- High Visibility / Bold Cartela Grid -->
  <div class="cartela-container" id="cartelaGrid">
    <!-- Generated dynamically or listed explicitly -->
  </div>

  <div class="footer-nav">
    <button class="btn-switch">⬅ ክፍል መቀየሪያ</button>
  </div>

  <script>
    // Initialize Telegram Mini App Fullscreen Mode
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand(); // Force Fullscreen view
    }

    // Populate Cartela Grid (600 Cartelas)
    const grid = document.getElementById('cartelaGrid');
    for (let i = 1; i <= 30; i++) { // Initial visible 30 cards, scroll for more
      const card = document.createElement('div');
      card.className = 'cartela-card';
      card.innerText = `#${i}`;
      card.onclick = function() {
        this.classList.toggle('selected');
      };
      grid.appendChild(card);
    }
  </script>
</body>
</html>
