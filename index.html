<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Bingo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c2733;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #2b394a;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #2ea6ff; }
        .btn {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 Fast Bingo Game</h1>
        <p>እንኳን ወደ Fast Bingo በሰላም መጡ!</p>
        <button class="btn" onclick="alert('ጨዋታው በቅርብ ቀን ይጀምራል!')">ካርቴላ ቁረጥ</button>
    </div>
</body>
</html>
