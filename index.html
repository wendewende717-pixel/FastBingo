<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Bingo - Pro Ecosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --free-card: #10b981;  /* አረንጓዴ - ያልተያዘ */
            --taken-card: #ef4444; /* ቀይ - የተያዘ */
            --selected-card: #3b82f6; /* ሰማያዊ - አንተ የመረጥከው */
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Rule & Dynamic Announcement Bar */
        .announcement-bar {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 2. Room Selector & Stats Header */
        .header-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .stat-badge {
            background-color: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        /* 3. 600 Card Grid System */
        .card-selector-title {
            font-size: 14px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 400px;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card-item {
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .card-item.free { background-color: var(--free-card); color: #000; }
        .card-item.taken { background-color: var(--taken-card); cursor: not-allowed; opacity: 0.6; }
        .card-item.selected { background-color: var(--selected-card); border: 2px solid #fff; }

        /* 4. Active Bingo Board (5x5 Grid) */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
        }

        .grid-header {
            background-color: #334155;
            color: #38bdf8;
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            border-radius: 6px;
        }

        .cell {
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell.marked { background-color: #ef4444; color: white; }
        .cell.one-away { border: 2px solid #f59e0b; animation: shake 0.5s; } /* 1 Away Alert */

        /* 5. Control Buttons */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-bingo { background-color: #22c55e; color: white; font-size: 16px; }
        .btn-auto { background-color: #3b82f6; color: white; }
    </style>
</head>
<body>

    <!-- 1. Dynamic Game Rule Banner -->
    <div class="announcement-bar" id="ruleBanner">
        📢 ህግ፡ FULL HOUSE (ሙሉ ሰሌዳ) - አሸናፊ 80 ETB
    </div>

    <!-- 2. Player Stats -->
    <div class="header-stats">
        <div class="stat-badge">💰 Wallet: <span id="balance">0.00</span> ETB</div>
        <div class="stat-badge">ከፍል፡ 10 ETB</div>
        <div class="stat-badge">ካርቴላ፡ <span id="selectedCount">0</span>/6</div>
    </div>

    <!-- 3. 600 Card Selector Grid (Sample Visual Representation) -->
    <div class="card-selector-title">ከ 600 ካርቴላዎች ይምረጡ (አረንጓዴ=ነፃ | ቀይ=የተያዘ)፦</div>
    <div class="cards-grid" id="cardsGrid">
        <!-- Generated Dynamically via JS -->
    </div>

    <!-- 4. Active Bingo Card Matrix -->
    <div class="bingo-board" id="bingoBoard">
        <div class="grid-header">B</div>
        <div class="grid-header">I</div>
        <div class="grid-header">N</div>
        <div class="grid-header">G</div>
        <div class="grid-header">O</div>
        <!-- Cells generated via JS -->
    </div>

    <!-- 5. Controls -->
    <div class="controls">
        <button class="btn btn-auto" onclick="toggleAutoPilot()">🤖 Auto-Pilot: OFF</button>
        <button class="btn btn-bingo" onclick="claimBingo()">🔥 BINGO!</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedCards = [];

        // Generate 600 Card Selection Grid
        function initCardSelector() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 600; i++) {
                const item = document.createElement('div');
                item.className = 'card-item free';
                item.innerText = '#' + i;
                
                // Simulate some taken cards for visual test
                if (i === 15 || i === 99 || i === 100) {
                    item.className = 'card-item taken';
                } else {
                    item.onclick = () => selectCard(i, item);
                }
                grid.appendChild(item);
            }
        }

        function selectCard(cardId, element) {
            if (selectedCards.includes(cardId)) {
                selectedCards = selectedCards.filter(id => id !== cardId);
                element.className = 'card-item free';
            } else {
                if (selectedCards.length >= 6) {
                    tg.showAlert("በአንድ ጨዋታ ከ 6 ካርቴላ በላይ መያዝ አይችሉም!");
                    return;
                }
                selectedCards.push(cardId);
                element.className = 'card-item selected';
            }
            document.getElementById('selectedCount').innerText = selectedCards.length;
        }

        function claimBingo() {
            tg.showAlert("🎉 አውቶ-ማረጋገጫ፡ ሰርቨሩ ቢንጎን በማጣራት ላይ ነው...");
        }

        function toggleAutoPilot() {
            tg.showAlert("🤖 Auto-Pilot ተበራክቷል! ኔትወርክ ቢቋረጥም ሲስተሙ ይጫወታልሃል።");
        }

        initCardSelector();
    </script>
</body>
</html>
