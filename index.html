<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Bingo - Complete Ecosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --free-card: #10b981;
            --taken-card: #ef4444;
            --selected-card: #3b82f6;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .announcement-bar {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .stat-badge {
            background-color: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .drawn-box {
            width: 100%;
            max-width: 400px;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 400px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .card-item {
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .card-item.free { background-color: var(--free-card); color: #000; }
        .card-item.taken { background-color: var(--taken-card); opacity: 0.6; }
        .card-item.selected { background-color: var(--selected-card); border: 2px solid #fff; }

        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
        }

        .grid-header {
            background-color: #334155;
            color: #38bdf8;
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            border-radius: 6px;
        }

        .cell {
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell.marked { background-color: #ef4444; color: white; }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-bingo { background-color: #22c55e; color: white; }
        .btn-action { background-color: #3b82f6; color: white; }
    </style>
</head>
<body>

    <div class="announcement-bar" id="ruleBanner">📢 ህግ፡ FULL HOUSE</div>

    <div class="header-stats">
        <div class="stat-badge">💰 Wallet: <span id="balance">0.00</span> ETB</div>
        <div class="stat-badge">ክፍል፡ 10 ETB</div>
        <div class="stat-badge">ካርቴላ፡ <span id="selectedCount">0</span>/6</div>
    </div>

    <div class="drawn-box" id="drawnBox">🎯 የወጣ ቁጥር: -</div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="bingo-board" id="bingoBoard">
        <div class="grid-header">B</div>
        <div class="grid-header">I</div>
        <div class="grid-header">N</div>
        <div class="grid-header">G</div>
        <div class="grid-header">O</div>
    </div>

    <div class="controls">
        <button class="btn btn-action" onclick="drawNextNumber()">🎲 ቁጥር ጥራ</button>
        <button class="btn btn-action" onclick="getReferralLink()">🔗 10 ETB ቦነስ</button>
        <button class="btn btn-bingo" onclick="verifyBingo()">🔥 BINGO!</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || "guest_user";
        let selectedCards = [];

        async function fetchWallet() {
            try {
                let res = await fetch(`/api/wallet/${userId}`);
                let data = await res.json();
                if(data.success) {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                }
            } catch(e) {}
        }

        function initCardSelector() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 600; i++) {
                const item = document.createElement('div');
                item.className = 'card-item free';
                item.innerText = '#' + i;
                if (i === 15 || i === 99 || i === 100) {
                    item.className = 'card-item taken';
                } else {
                    item.onclick = () => selectCard(i, item);
                }
                grid.appendChild(item);
            }
        }

        function selectCard(cardId, element) {
            if (selectedCards.includes(cardId)) {
                selectedCards = selectedCards.filter(id => id !== cardId);
                element.className = 'card-item free';
            } else {
                if (selectedCards.length >= 6) {
                    tg.showAlert("በአንድ ጨዋታ ከ 6 ካርቴላ በላይ መያዝ አይችሉም!");
                    return;
                }
                selectedCards.push(cardId);
                element.className = 'card-item selected';
            }
            document.getElementById('selectedCount').innerText = selectedCards.length;
        }

        async function drawNextNumber() {
            let res = await fetch('/api/draw-number', { method: 'POST' });
            let data = await res.json();
            if(data.success) {
                document.getElementById('drawnBox').innerText = `🎯 የወጣ ቁጥር: ${data.drawn_number}`;
            } else {
                tg.showAlert(data.message);
            }
        }

        async function verifyBingo() {
            if(selectedCards.length === 0) {
                tg.showAlert("እባክዎን መጀመሪያ ካርቴላ ይምረጡ!");
                return;
            }
            let res = await fetch('/api/verify-bingo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ card_id: selectedCards[0], player_name: tg.initDataUnsafe?.user?.first_name || "Player" })
            });
            let data = await res.json();
            if(data.success) {
                tg.showAlert(data.announcement);
            }
        }

        function getReferralLink() {
            let link = `https://t.me/YOUR_BOT_USERNAME?start=${userId}`;
            tg.showAlert(`🔗 የግብዣ ሊንክዎ፡\n${link}\n\nበዚህ ሊንክ ለሚገቡ አዲስ ተጫዋቾች ለሁለታችሁም 10 ETB ቦነስ ይገባል!`);
        }

        initCardSelector();
        fetchWallet();
    </script>
</body>
</html>
