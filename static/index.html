<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Bingo NextGen Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #2563eb;
      --my-cartela: #007bff; /* ደማቅ ሰማያዊ */
      --taken-cartela: #dc2626; /* ደማቅ ቀይ */
      --free-cartela: #334155; /* ያልተያዘ ክፍት ካርቴላ */
      --text-gold: #f59e0b;
      --text-white: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Top User Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #182232;
      border-bottom: 1px solid #334155;
    }
    .user-name { font-weight: bold; font-size: 16px; }
    .balance-badge {
      background: #10b981;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Views container */
    .view-section { display: none; padding: 15px; }
    .view-section.active { display: block; }

    /* Room Cards (ደራሽ የተሰኘው ፅሁፍ ተወግዷል) */
    .room-title { text-align: center; color: var(--text-gold); font-size: 18px; margin-bottom: 15px; }
    .rooms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .room-card {
      background: var(--card-bg);
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
    }
    .room-card .name { color: var(--text-gold); font-weight: bold; font-size: 16px; }
    .room-card .price { color: #38bdf8; font-size: 20px; font-weight: bold; margin-top: 5px; }
    .vip-card {
      grid-column: span 2;
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      border: 1px solid #eab308;
    }

    /* Game Header Stats Header */
    .game-stats-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #182232;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 10px;
    }
    .stat-box {
      background: #0f172a;
      padding: 6px 2px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat-box .title { font-size: 10px; color: #94a3b8; }
    .stat-box .val { font-size: 12px; font-weight: bold; color: var(--text-gold); }

    /* Action Toolbar */
    .action-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .search-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
    }
    .btn-action {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Legend */
    .legend-bar {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 3px; }

    /* Grid 1-600 Cartelas */
    .cartela-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .cartela-btn {
      aspect-ratio: 1;
      background: var(--free-cartela);
      border: 1px solid #475569;
      color: #fff;
      border-radius: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .cartela-btn.my-selected {
      background: var(--my-cartela) !important;
      border-color: #60a5fa;
      box-shadow: 0 0 8px #2563eb;
    }
    .cartela-btn.taken {
      background: var(--taken-cartela) !important;
      border-color: #f87171;
      opacity: 0.85;
      cursor: not-allowed;
    }

    /* Warning Overlay Toast */
    .warning-toast {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #dc2626;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(220,38,38,0.5);
      display: none;
      z-index: 1000;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Warning Toast Container -->
  <div id="warningToast" class="warning-toast"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="user-name" id="userName">Wende</div>
    <div class="balance-badge" id="userBalance">0 ETB</div>
  </div>

  <!-- VIEW 1: ROOM SELECTION PAGE -->
  <div id="roomView" class="view-section active">
    <div class="room-title">🎯 የጨዋታ ክፍል ይምረጡ</div>
    <div class="rooms-grid">
      <div class="room-card" onclick="enterRoom(5)">
        <div class="name">ክፍል 5</div>
        <div class="price">5 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(10)">
        <div class="name">ክፍል 10</div>
        <div class="price">10 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(15)">
        <div class="name">ክፍል 15</div>
        <div class="price">15 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(20)">
        <div class="name">ክፍል 20</div>
        <div class="price">20 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(25)">
        <div class="name">ክፍል 25</div>
        <div class="price">25 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(50)">
        <div class="name">ክፍል 50</div>
        <div class="price">50 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(100)">
        <div class="name">ክፍል 100</div>
        <div class="price">100 ETB</div>
      </div>
      <div class="room-card" onclick="enterRoom(200)">
        <div class="name">ክፍል 200</div>
        <div class="price">200 ETB</div>
      </div>
      <div class="room-card vip-card" onclick="enterRoom(500)">
        <div class="name">👑 VIP ቪአይፒ ክፍል</div>
        <div class="price">500 ETB</div>
      </div>
    </div>
  </div>

  <!-- VIEW 2: GAME BOARD PAGE -->
  <div id="gameView" class="view-section">
    <!-- Game Header Stats -->
    <div class="game-stats-header">
      <div class="stat-box">
        <div class="title">GAME ID</div>
        <div class="val" id="gameId">#FB-5-1001</div>
      </div>
      <div class="stat-box">
        <div class="title">PLAYERS</div>
        <div class="val" id="playersCount">0</div>
      </div>
      <div class="stat-box">
        <div class="title">BET</div>
        <div class="val" id="betAmount">5 ETB</div>
      </div>
      <div class="stat-box">
        <div class="title">DERASH</div>
        <div class="val" id="derashAmount" style="color: #38bdf8;">0 ETB</div>
      </div>
      <div class="stat-box">
        <div class="title">TIMER</div>
        <div class="val" id="timerCount" style="color:#f59e0b;">60s</div>
      </div>
    </div>

    <!-- Action Toolbar -->
    <div class="action-toolbar">
      <input type="number" id="numInput" class="search-input" placeholder="ቁጥር (1-600)" min="1" max="600" oninput="autoSelectNumber(this.value)">
      <button class="btn-action" onclick="autoPickBySystem()">ሲስተሙ ይምረጥልኝ</button>
      <button class="btn-action" style="background:#eab308; color:#000;" id="selectedBtnCount">የተያዙ (0)</button>
    </div>

    <!-- Color Legend -->
    <div class="legend-bar">
      <div class="legend-item"><div class="dot" style="background:var(--free-cartela);"></div> ክፍት</div>
      <div class="legend-item"><div class="dot" style="background:var(--taken-cartela);"></div> የተያዘ (ሌሎች)</div>
      <div class="legend-item"><div class="dot" style="background:var(--my-cartela);"></div> የኔ ካርቴላ</div>
    </div>

    <!-- 600 Grid Container -->
    <div class="cartela-grid" id="cartelaGrid"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let userBalance = 100;
    let currentRoomPrice = 5;
    let mySelectedCartelas = [];
    let takenCartelasByOthers = [5, 12, 45, 88];
    let timerRunning = false;
    let timerSeconds = 60;
    let timerInterval = null;

    document.getElementById('userBalance').innerText = `${userBalance} ETB`;
    if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
    }

    function triggerWarning(msg) {
      if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
      const toast = document.getElementById('warningToast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function enterRoom(price) {
      currentRoomPrice = price;
      document.getElementById('betAmount').innerText = `${price} ETB`;
      document.getElementById('gameId').innerText = `#FB-${price}-${Math.floor(1000 + Math.random() * 9000)}`;
      document.getElementById('roomView').classList.remove('active');
      document.getElementById('gameView').classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('cartelaGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 600; i++) {
        const btn = document.createElement('div');
        btn.className = 'cartela-btn';
        btn.innerText = i;

        if (takenCartelasByOthers.includes(i)) {
          btn.classList.add('taken');
        } else if (mySelectedCartelas.includes(i)) {
          btn.classList.add('my-selected');
        }

        btn.onclick = () => toggleCartelaSelection(i);
        grid.appendChild(btn);
      }
    }

    function toggleCartelaSelection(num) {
      if (takenCartelasByOthers.includes(num)) return;

      if (mySelectedCartelas.includes(num)) {
        mySelectedCartelas = mySelectedCartelas.filter(c => c !== num);
      } else {
        if (mySelectedCartelas.length >= 6) {
          triggerWarning("⚠️ ከአንድ ጨዋታ እስከ 6 ካርቴላ ብቻ መያዝ ይችላሉ!");
          return;
        }
        const totalRequired = (mySelectedCartelas.length + 1) * currentRoomPrice;
        if (userBalance < totalRequired) {
          triggerWarning("⚠️ በቂ ቀሪ ሂሳብ የለዎትም! እባክዎን ሂሳብዎን ይሙሉ::");
          return;
        }
        mySelectedCartelas.push(num);
      }

      updateGameCalculations();
      renderGrid();
    }

    function autoSelectNumber(val) {
      const num = parseInt(val);
      if (num >= 1 && num <= 600) {
        if (!mySelectedCartelas.includes(num)) {
          toggleCartelaSelection(num);
        }
      }
    }

    function autoPickBySystem() {
      if (mySelectedCartelas.length >= 6) {
        triggerWarning("⚠️ ከአንድ ጨዋታ እስከ 6 ካርቴላ ብቻ መያዝ ይችላሉ!");
        return;
      }
      let randomNum;
      do {
        randomNum = Math.floor(Math.random() * 600) + 1;
      } while (takenCartelasByOthers.includes(randomNum) || mySelectedCartelas.includes(randomNum));

      toggleCartelaSelection(randomNum);

      if(navigator.vibrate) navigator.vibrate([150, 50, 150]);
      triggerWarning(`🎲 ሲስተሙ ካርቴላ ቁጥር ${randomNum} መርጦልዎታል!`);
    }

    function updateGameCalculations() {
      const userHasCartela = mySelectedCartelas.length > 0;
      let totalPlayersCount = (userHasCartela ? 1 : 0) + (takenCartelasByOthers.length > 0 ? 1 : 0);
      document.getElementById('playersCount').innerText = totalPlayersCount;

      const totalCartelasInGame = mySelectedCartelas.length + takenCartelasByOthers.length;
      const totalPool = totalCartelasInGame * currentRoomPrice;
      const derashNet = Math.floor(totalPool * 0.80);
      document.getElementById('derashAmount').innerText = `${derashNet} ETB`;

      document.getElementById('selectedBtnCount').innerText = `የተያዙ (${mySelectedCartelas.length})`;

      if (totalPlayersCount >= 2 && !timerRunning) {
        startTimer();
      }
    }

    function startTimer() {
      timerRunning = true;
      timerSeconds = 60;
      timerInterval = setInterval(() => {
        timerSeconds--;
        document.getElementById('timerCount').innerText = `${timerSeconds}s`;
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          alert("🎲 ጨዋታው ተጀምሯል!");
        }
      }, 1000);
    }
  </script>
</body>
</html>
