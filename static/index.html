<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fast Bingo NextGen Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --my-card-blue: #2563eb;
            --taken-card-red: #dc2626;
            --free-card-bg: #334155;
            --text-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* NAVBAR */
        .header {
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-badge {
            background: linear-gradient(135deg, #16a34a, #15803d);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }

        /* PAGES */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 10px;
            height: calc(100vh - 55px);
            overflow-y: auto;
        }

        .page.active {
            display: flex;
        }

        /* ROOM SELECTION PAGE */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            padding-bottom: 20px;
        }

        .room-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .room-card.vip {
            border: 2px solid var(--text-gold);
            background: linear-gradient(145deg, #312e81, #1e1b4b);
            grid-column: span 2;
        }

        .room-card:active {
            transform: scale(0.97);
        }

        .room-title {
            color: var(--text-gold);
            font-size: 16px;
            font-weight: bold;
        }

        .room-price {
            font-size: 20px;
            margin-top: 6px;
            color: #38bdf8;
            font-weight: 800;
        }

        .room-card.vip .room-price {
            color: var(--text-gold);
        }

        /* GAME BOARD PAGE */
        .game-stats-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            text-align: center;
        }

        .stat-box {
            background: #0f172a;
            padding: 4px 2px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .stat-label {
            font-size: 9px;
            color: #94a3b8;
            display: block;
        }

        .stat-val {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
        }

        .legend-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 5px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* FULL SCREEN BINGO CARDS GRID */
        .cards-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            overflow-y: auto;
        }

        .bingo-card-btn {
            background-color: var(--free-card-bg);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            cursor: pointer;
        }

        .bingo-card-btn.taken {
            background-color: var(--taken-card-red) !important;
            color: #ffffff;
        }

        .bingo-card-btn.mine {
            background-color: var(--my-card-blue) !important;
            color: #ffffff;
            border: 2px solid #60a5fa;
            box-shadow: 0 0 6px #2563eb;
        }

        /* CONTROL FOOTER */
        .game-footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
            padding-bottom: 4px;
        }

        .btn-action {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-leave { background-color: #ef4444; }
        .btn-refresh { background-color: #f59e0b; }
        .btn-auto { background-color: #10b981; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="header">
        <div class="user-info">
            <span id="user-name" style="font-weight: bold;">ተጫዋች</span>
        </div>
        <div class="balance-badge" id="user-balance">50 ETB</div>
    </div>

    <!-- 1. ROOM SELECTION PAGE (ያለ ደራሽ ጽሁፍ) -->
    <div id="p-rooms" class="page active">
        <h3 style="text-align: center; color: var(--text-gold); margin: 5px 0 10px 0;">🎯 የጨዋታ ክፍል ይምረጡ</h3>
        <div class="rooms-grid">
            <div class="room-card" onclick="selectRoom('FB-5', 5)">
                <div class="room-title">ክፍል 5</div>
                <div class="room-price">5 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-10', 10)">
                <div class="room-title">ክፍል 10</div>
                <div class="room-price">10 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-15', 15)">
                <div class="room-title">ክፍል 15</div>
                <div class="room-price">15 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-20', 20)">
                <div class="room-title">ክፍል 20</div>
                <div class="room-price">20 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-25', 25)">
                <div class="room-title">ክፍል 25</div>
                <div class="room-price">25 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-50', 50)">
                <div class="room-title">ክፍል 50</div>
                <div class="room-price">50 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-100', 100)">
                <div class="room-title">ክፍል 100</div>
                <div class="room-price">100 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-200', 200)">
                <div class="room-title">ክፍል 200</div>
                <div class="room-price">200 ETB</div>
            </div>
            <!-- VIP ROOM -->
            <div class="room-card vip" onclick="selectRoom('FB-VIP', 500)">
                <div class="room-title">👑 VIP ቪአይፒ ክፍል</div>
                <div class="room-price">500 ETB</div>
            </div>
        </div>
    </div>

    <!-- 2. GAME BOARD PAGE -->
    <div id="p-game" class="page">
        <!-- STATS BAR -->
        <div class="game-stats-bar">
            <div class="stat-box">
                <span class="stat-label">GAME ID</span>
                <span class="stat-val" id="game-id">#FB001</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">PLAYERS</span>
                <span class="stat-val" id="game-players">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">BET</span>
                <span class="stat-val" id="game-bet">10 ETB</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">DERASH</span>
                <span class="stat-val" id="game-derash">0 ETB</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">TIMER</span>
                <span class="stat-val" id="game-timer" style="color: #f59e0b;">30s</span>
            </div>
        </div>

        <!-- LEGEND GUIDE -->
        <div class="legend-bar">
            <div class="legend-item">
                <div class="color-dot" style="background: var(--free-card-bg);"></div>
                <span>ክፍት</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: var(--taken-card-red);"></div>
                <span>የተያዘ</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: var(--my-card-blue);"></div>
                <span>የኔ ካርቴላ</span>
            </div>
        </div>

        <!-- FULL SCREEN CARDS GRID -->
        <div class="cards-container" id="cards-grid"></div>

        <!-- FOOTER -->
        <div class="game-footer">
            <button class="btn-action btn-leave" onclick="leaveRoom()">Leave</button>
            <button class="btn-action btn-refresh" onclick="refreshGrid()">Refresh</button>
            <button class="btn-action btn-auto">Automatic: ON</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let myBalance = 50.0;
        let currentRoomPrice = 0;

        function initApp() {
            if(tg) {
                tg.expand();
                if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
                }
            }
            renderCardsGrid();
        }

        function selectRoom(roomId, price) {
            if(myBalance < price) {
                alert("በቂ ቀሪ ሂሳብ የሎትም! እባክዎን አስቀድመው ብር ያስገቡ።");
                return;
            }
            
            currentRoomPrice = price;
            myBalance -= price;
            document.getElementById('user-balance').innerText = myBalance + " ETB";
            
            document.getElementById('game-id').innerText = "#" + roomId + "-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('game-bet').innerText = price + " ETB";
            document.getElementById('game-derash').innerText = "0 ETB";

            document.getElementById('p-rooms').classList.remove('active');
            document.getElementById('p-game').classList.add('active');
        }

        function renderCardsGrid() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = "";

            for(let i = 1; i <= 96; i++) {
                const btn = document.createElement('button');
                btn.className = 'bingo-card-btn';
                btn.innerText = i;

                if(i % 3 === 0 && i % 5 !== 0) {
                    btn.classList.add('taken');
                }

                btn.onclick = function() {
                    if(btn.classList.contains('taken')) {
                        alert("ይህ ካርቴላ በሌላ ተጫዋች ተይዟል!");
                        return;
                    }

                    if(btn.classList.contains('mine')) {
                        btn.classList.remove('mine');
                        myBalance += currentRoomPrice;
                    } else {
                        btn.classList.add('mine');
                    }
                    document.getElementById('user-balance').innerText = myBalance + " ETB";
                };

                grid.appendChild(btn);
            }
        }

        function leaveRoom() {
            document.getElementById('p-game').classList.remove('active');
            document.getElementById('p-rooms').classList.add('active');
        }

        function refreshGrid() {
            renderCardsGrid();
        }

        window.onload = initApp;
    </script>
</body>
</html>
