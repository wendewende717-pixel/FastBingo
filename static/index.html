<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Bingo NextGen Pro</title>
    <style>
        :root {
            --bg-dark: #0f1026;
            --card-bg: #1a1c38;
            --header-bg: #14152e;
            --accent-green: #00b894;
            --accent-red: #d63031;
            --accent-orange: #e67e22;
            --accent-purple: #6c5ce7;
            --text-main: #ffffff;
            --text-sub: #8c90ad;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); user-select: none; }

        /* Top Header Stats */
        .top-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
            background: var(--header-bg);
            border-bottom: 1px solid #282a4a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .stat-card {
            background: #1f2142;
            padding: 6px 2px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label { font-size: 9px; color: var(--text-sub); text-transform: uppercase; }
        .stat-value { font-size: 11px; font-weight: bold; color: #fff; margin-top: 2px; }
        .timer-val { color: #f1c40f; }

        /* Navigation Tabs */
        .view-switcher {
            display: flex;
            background: #14152e;
            padding: 4px;
            margin: 6px 8px;
            border-radius: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 12px;
            border-radius: 6px;
        }

        .tab-btn.active { background: var(--accent-purple); color: #fff; }

        /* Cartela Selection Grid (1-600) */
        .cartela-section { padding: 8px; }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .c-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 10px 0;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .c-btn.selected { background: var(--accent-green); }
        .c-btn.taken { background: #3d405b; color: #7f8c8d; cursor: not-allowed; }

        /* Active Cartelas Display */
        .selected-cartelas-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 8px;
        }

        .cartela-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 6px;
            border: 1px solid #282a4a;
        }

        .cartela-header {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 4px;
        }

        .mini-bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            text-align: center;
        }

        .b-head { font-size: 10px; font-weight: bold; padding: 2px; color: #fff; border-radius: 2px; }
        .b-cell { background: #25284b; font-size: 10px; padding: 4px 0; border-radius: 2px; font-weight: 500; }
        .b-cell.star { background: var(--accent-orange); color: #fff; }
        .b-cell.daubed { background: var(--accent-green); color: #fff; }

        /* Bottom Control Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: var(--header-bg);
            border-top: 1px solid #282a4a;
        }

        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        .btn-leave { background: var(--accent-red); }
        .btn-refresh { background: var(--accent-orange); }
        .btn-auto { background: var(--accent-green); }
    </style>
</head>
<body>

    <!-- Header Info Bar -->
    <div class="top-stats">
        <div class="stat-card"><div class="stat-label">Game ID</div><div class="stat-val" id="gameId">FB001</div></div>
        <div class="stat-card"><div class="stat-label">Players</div><div class="stat-val" id="players">595</div></div>
        <div class="stat-card"><div class="stat-label">Bet</div><div class="stat-val">10 ETB</div></div>
        <div class="stat-card"><div class="stat-label">Derash</div><div class="stat-val" id="derash">4760</div></div>
        <div class="stat-card"><div class="stat-label">Timer</div><div class="stat-val timer-val" id="timer">30 s</div></div>
    </div>

    <!-- View Switcher -->
    <div class="view-switcher">
        <button class="tab-btn active" onclick="switchTab('grid')">ካርቴላ መምረጫ (1-600)</button>
        <button class="tab-btn" onclick="switchTab('game')">የኔ ካርቴላዎች</button>
    </div>

    <!-- 1-600 Selection Section -->
    <div id="gridSection" class="cartela-section">
        <div class="cartela-grid" id="cartelaContainer"></div>
    </div>

    <!-- Live Selected Cartelas Section -->
    <div id="gameSection" style="display: none;">
        <div class="selected-cartelas-preview" id="selectedCartelasContainer">
            <!-- Selected Cartelas will render here -->
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
        <button class="action-btn btn-leave">Leave</button>
        <button class="action-btn btn-refresh" onclick="location.reload()">Refresh</button>
        <button class="action-btn btn-auto" id="autoBtn" onclick="toggleAuto()">Automatic: ON</button>
    </div>

    <script>
        let selectedCartelas = [553, 554];

        // Generate 1-600 Cartela Grid
        const container = document.getElementById('cartelaContainer');
        for (let i = 1; i <= 600; i++) {
            const btn = document.createElement('button');
            btn.className = 'c-btn' + (selectedCartelas.includes(i) ? ' selected' : '');
            btn.innerText = i;
            btn.onclick = () => toggleCartela(i, btn);
            container.appendChild(btn);
        }

        function toggleCartela(num, btn) {
            if (selectedCartelas.includes(num)) {
                selectedCartelas = selectedCartelas.filter(c => c !== num);
                btn.classList.remove('selected');
            } else {
                selectedCartelas.push(num);
                btn.classList.add('selected');
            }
            renderSelectedCartelas();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'grid') {
                document.getElementById('gridSection').style.display = 'block';
                document.getElementById('gameSection').style.display = 'none';
                event.target.classList.add('active');
            } else {
                document.getElementById('gridSection').style.display = 'none';
                document.getElementById('gameSection').style.display = 'block';
                event.target.classList.add('active');
            }
        }

        function renderSelectedCartelas() {
            const container = document.getElementById('selectedCartelasContainer');
            container.innerHTML = '';
            selectedCartelas.forEach(cNum => {
                container.innerHTML += `
                    <div class="cartela-card">
                        <div class="cartela-header">Cartela No: ${cNum}</div>
                        <div class="mini-bingo-grid">
                            <div class="b-head" style="background:#0984e3">B</div>
                            <div class="b-head" style="background:#6c5ce7">I</div>
                            <div class="b-head" style="background:#a29bfe">N</div>
                            <div class="b-head" style="background:#00b894">G</div>
                            <div class="b-head" style="background:#e17055">O</div>
                            
                            <div class="b-cell">7</div><div class="b-cell">16</div><div class="b-cell">33</div><div class="b-cell">60</div><div class="b-cell">71</div>
                            <div class="b-cell">1</div><div class="b-cell">23</div><div class="b-cell">41</div><div class="b-cell">50</div><div class="b-cell">69</div>
                            <div class="b-cell">2</div><div class="b-cell">20</div><div class="b-cell star">★</div><div class="b-cell">59</div><div class="b-cell">66</div>
                            <div class="b-cell">5</div><div class="b-cell">22</div><div class="b-cell">40</div><div class="b-cell">56</div><div class="b-cell">70</div>
                            <div class="b-cell">15</div><div class="b-cell">28</div><div class="b-cell">42</div><div class="b-cell">58</div><div class="b-cell">67</div>
                        </div>
                    </div>
                `;
            });
        }

        renderSelectedCartelas();
    </script>
</body>
</html>
