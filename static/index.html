<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fast Bingo NextGen Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --my-card-blue: #2563eb;
            --taken-card-red: #dc2626;
            --free-card-bg: #334155;
            --text-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* NAVBAR */
        .header {
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-badge {
            background: linear-gradient(135deg, #16a34a, #15803d);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }

        /* PAGES */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 10px;
            height: calc(100vh - 55px);
            overflow-y: auto;
        }

        .page.active {
            display: flex;
        }

        /* ROOM SELECTION PAGE */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            padding-bottom: 20px;
        }

        .room-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .room-card.vip {
            border: 2px solid var(--text-gold);
            background: linear-gradient(145deg, #312e81, #1e1b4b);
            grid-column: span 2;
        }

        .room-card:active {
            transform: scale(0.97);
        }

        .room-title {
            color: var(--text-gold);
            font-size: 16px;
            font-weight: bold;
        }

        .room-price {
            font-size: 20px;
            margin-top: 6px;
            color: #38bdf8;
            font-weight: 800;
        }

        .room-card.vip .room-price {
            color: var(--text-gold);
        }

        /* GAME BOARD PAGE */
        .game-stats-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            text-align: center;
        }

        .stat-box {
            background: #0f172a;
            padding: 4px 2px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .stat-label {
            font-size: 9px;
            color: #94a3b8;
            display: block;
        }

        .stat-val {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
        }

        .legend-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 5px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* ACTION INPUT & BUTTONS BAR */
        .quick-action-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .lucky-input {
            width: 110px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 11px;
            text-align: center;
        }

        .btn-quick {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-lucky { background-color: #0284c7; }
        .btn-auto-pick { background-color: #16a34a; }
        .btn-taken-info { background-color: #d97706; }

        /* FULL SCREEN BINGO CARDS GRID (600 CARDS) */
        .cards-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            overflow-y: auto;
            max-height: 50vh;
        }

        .bingo-card-btn {
            background-color: var(--free-card-bg);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            cursor: pointer;
        }

        .bingo-card-btn.taken {
            background-color: var(--taken-card-red) !important;
            color: #ffffff;
        }

        .bingo-card-btn.mine {
            background-color: var(--my-card-blue) !important;
            color: #ffffff;
            border: 2px solid #60a5fa;
            box-shadow: 0 0 6px #2563eb;
        }

        /* CONTROL FOOTER */
        .game-footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
            padding-bottom: 4px;
        }

        .btn-action {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-leave { background-color: #ef4444; }
        .btn-refresh { background-color: #f59e0b; }
        .btn-auto { background-color: #10b981; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="header">
        <div class="user-info">
            <span id="user-name" style="font-weight: bold;">ተጫዋች</span>
        </div>
        <div class="balance-badge" id="user-balance">50 ETB</div>
    </div>

    <!-- 1. ROOM SELECTION PAGE -->
    <div id="p-rooms" class="page active">
        <h3 style="text-align: center; color: var(--text-gold); margin: 5px 0 10px 0;">🎯 የጨዋታ ክፍል ይምረጡ</h3>
        <div class="rooms-grid">
            <div class="room-card" onclick="selectRoom('FB-5', 5)">
                <div class="room-title">ክፍል 5</div>
                <div class="room-price">5 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-10', 10)">
                <div class="room-title">ክፍል 10</div>
                <div class="room-price">10 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-15', 15)">
                <div class="room-title">ክፍል 15</div>
                <div class="room-price">15 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-20', 20)">
                <div class="room-title">ክፍል 20</div>
                <div class="room-price">20 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-25', 25)">
                <div class="room-title">ክፍል 25</div>
                <div class="room-price">25 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-50', 50)">
                <div class="room-title">ክፍል 50</div>
                <div class="room-price">50 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-100', 100)">
                <div class="room-title">ክፍል 100</div>
                <div class="room-price">100 ETB</div>
            </div>
            <div class="room-card" onclick="selectRoom('FB-200', 200)">
                <div class="room-title">ክፍል 200</div>
                <div class="room-price">200 ETB</div>
            </div>
            <!-- VIP ROOM -->
            <div class="room-card vip" onclick="selectRoom('FB-VIP', 500)">
                <div class="room-title">👑 VIP ቪአይፒ ክፍል</div>
                <div class="room-price">500 ETB</div>
            </div>
        </div>
    </div>

    <!-- 2. GAME BOARD PAGE -->
    <div id="p-game" class="page">
        <!-- STATS BAR -->
        <div class="game-stats-bar">
            <div class="stat-box">
                <span class="stat-label">GAME ID</span>
                <span class="stat-val" id="game-id">#FB001</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">PLAYERS</span>
                <span class="stat-val" id="game-players">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">BET</span>
                <span class="stat-val" id="game-bet">5 ETB</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">DERASH</span>
                <span class="stat-val" id="game-derash">0 ETB</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">TIMER</span>
                <span class="stat-val" id="game-timer" style="color: #f59e0b;">60s</span>
            </div>
        </div>

        <!-- QUICK ACTION BAR -->
        <div class="quick-action-bar">
            <input type="number" id="lucky-num" class="lucky-input" placeholder="ቁጥር (1-600)" min="1" max="600">
            <button class="btn-quick btn-lucky" onclick="selectLuckyNumber()">ምረጥ</button>
            <button class="btn-quick btn-auto-pick" onclick="autoSelectCard()">ሲስተሙ ይምረጥ</button>
            <button class="btn-quick btn-taken-info" onclick="showTakenCardsInfo()">የተያዙ (0)</button>
        </div>

        <!-- LEGEND GUIDE -->
        <div class="legend-bar">
            <div class="legend-item">
                <div class="color-dot" style="background: var(--free-card-bg);"></div>
                <span>ክፍት</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: var(--taken-card-red);"></div>
                <span>የተያዘ</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: var(--my-card-blue);"></div>
                <span>የኔ ካርቴላ</span>
            </div>
        </div>

        <!-- FULL SCREEN CARDS GRID (600) -->
        <div class="cards-container" id="cards-grid"></div>

        <!-- FOOTER -->
        <div class="game-footer">
            <button class="btn-action btn-leave" onclick="leaveRoom()">Leave</button>
            <button class="btn-action btn-refresh" onclick="refreshGrid()">Refresh</button>
            <button class="btn-action btn-auto">Automatic: ON</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let myBalance = 50.0;
        let currentRoomPrice = 0;
        let myUserId = "Me";

        // Game State Variables
        let myCards = [];
        let takenCardsMap = {}; // Example: { 10: "Player1", 12: "Player1", 45: "Player2" }
        let playerMap = {}; // Unique Player Tracking: { "Player1": ["Card10", "Card12"], "Player2": ["Card45"] }
        
        let timerSeconds = 60;
        let timerInterval = null;
        let isTimerRunning = false;
        const MAX_CARDS_PER_PLAYER = 6;

        function initApp() {
            if(tg) {
                tg.expand();
                if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
                    myUserId = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || "Me";
                }
            }
            renderCardsGrid();
        }

        function selectRoom(roomId, price) {
            if(myBalance < price) {
                alert("በቂ ቀሪ ሂሳብ የሎትም! እባክዎን አስቀድመው ብር ያስገቡ።");
                return;
            }
            
            currentRoomPrice = price;
            
            document.getElementById('game-id').innerText = "#" + roomId + "-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('game-bet').innerText = price + " ETB";

            document.getElementById('p-rooms').classList.remove('active');
            document.getElementById('p-game').classList.add('active');
            
            updateStatsAndDerash();
        }

        // Render 1 to 600 Bingo Cards
        function renderCardsGrid() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = "";

            for(let i = 1; i <= 600; i++) {
                const btn = document.createElement('button');
                btn.className = 'bingo-card-btn';
                btn.id = 'card-btn-' + i;
                btn.innerText = i;

                btn.onclick = function() {
                    handleCardSelection(i);
                };

                grid.appendChild(btn);
            }
        }

        function handleCardSelection(cardNum) {
            // 1. If taken by someone else
            if(takenCardsMap[cardNum] && takenCardsMap[cardNum] !== myUserId) {
                alert(`ካርቴላ #${cardNum} በሌላ ተጫዋች (${takenCardsMap[cardNum]}) ተይዟል!`);
                return;
            }

            // 2. If already selected by me (Deselect)
            if(myCards.includes(cardNum)) {
                myCards = myCards.filter(c => c !== cardNum);
                delete takenCardsMap[cardNum];
                
                // Remove from player map
                if(playerMap[myUserId]) {
                    playerMap[myUserId] = playerMap[myUserId].filter(c => c !== cardNum);
                    if(playerMap[myUserId].length === 0) {
                        delete playerMap[myUserId];
                    }
                }

                myBalance += currentRoomPrice;
            } else {
                // 3. New selection (Max 6 limit check)
                if(myCards.length >= MAX_CARDS_PER_PLAYER) {
                    alert(`በአንድ ጨዋታ እስከ ${MAX_CARDS_PER_PLAYER} ካርቴላ ብቻ መያዝ ይችላሉ!`);
                    return;
                }

                if(myBalance < currentRoomPrice) {
                    alert("ተጨማሪ ካርቴላ ለመያዝ በቂ ቀሪ ሂሳብ የሎትም!");
                    return;
                }

                myCards.push(cardNum);
                takenCardsMap[cardNum] = myUserId;

                if(!playerMap[myUserId]) {
                    playerMap[myUserId] = [];
                }
                playerMap[myUserId].push(cardNum);

                myBalance -= currentRoomPrice;
            }

            document.getElementById('user-balance').innerText = myBalance + " ETB";
            updateGridVisuals();
            updateStatsAndDerash();
            checkTimerTrigger();
        }

        function updateGridVisuals() {
            for(let i = 1; i <= 600; i++) {
                const btn = document.getElementById('card-btn-' + i);
                if(!btn) continue;

                btn.className = 'bingo-card-btn';

                if(myCards.includes(i)) {
                    btn.classList.add('mine');
                } else if(takenCardsMap[i]) {
                    btn.classList.add('taken');
                }
            }
        }

        function updateStatsAndDerash() {
            const totalTakenCards = Object.keys(takenCardsMap).length;
            const uniquePlayersCount = Object.keys(playerMap).length;

            // 1. Update PLAYERS count (Actual Unique People, not cards count)
            document.getElementById('game-players').innerText = uniquePlayersCount;

            // 2. Calculate Derash: Total Pool = Cards * Bet, Commission = 20%, Derash = 80%
            const totalBetPool = totalTakenCards * currentRoomPrice;
            const derashAmount = totalBetPool * 0.80; // 20% commission deducted

            document.getElementById('game-derash').innerText = derashAmount + " ETB";
            
            // Update quick button info
            const btnTaken = document.querySelector('.btn-taken-info');
            if(btnTaken) {
                btnTaken.innerText = `የተያዙ (${totalTakenCards})`;
            }
        }

        // Timer starts only when 2nd Player buys a card
        function checkTimerTrigger() {
            const uniquePlayersCount = Object.keys(playerMap).length;

            if(uniquePlayersCount >= 2 && !isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    document.getElementById('game-timer').innerText = timerSeconds + "s";

                    if(timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        alert("ጨዋታው ተጀምሯል! መልካም ዕድል!");
                    }
                }, 1000);
            }
        }

        // Quick Lucky Number Selection
        function selectLuckyNumber() {
            const input = document.getElementById('lucky-num');
            const num = parseInt(input.value);

            if(!num || num < 1 || num > 600) {
                alert("እባክዎን ከ 1 እስከ 600 ቁጥር ያስገቡ!");
                return;
            }

            handleCardSelection(num);
            
            // Scroll directly to the chosen card
            const targetBtn = document.getElementById('card-btn-' + num);
            if(targetBtn) {
                targetBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            input.value = "";
        }

        // System Auto-Select Card
        function autoSelectCard() {
            if(myCards.length >= MAX_CARDS_PER_PLAYER) {
                alert(`በአንድ ጨዋታ እስከ ${MAX_CARDS_PER_PLAYER} ካርቴላ ብቻ መያዝ ይችላሉ!`);
                return;
            }

            let freeCards = [];
            for(let i = 1; i <= 600; i++) {
                if(!takenCardsMap[i]) {
                    freeCards.push(i);
                }
            }

            if(freeCards.length === 0) {
                alert("ሁሉም 600 ካርቴላዎች ተይዘዋል!");
                return;
            }

            const randomCard = freeCards[Math.floor(Math.random() * freeCards.length)];
            handleCardSelection(randomCard);

            const targetBtn = document.getElementById('card-btn-' + randomCard);
            if(targetBtn) {
                targetBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Show Taken Cards Modal / Info
        function showTakenCardsInfo() {
            const takenCards = Object.keys(takenCardsMap);
            if(takenCards.length === 0) {
                alert("እስካሁን ምንም የተያዘ ካርቴላ የለም!");
                return;
            }

            let summary = `📋 የተያዙ ካርቴላዎች ዝርዝር (አጠቃላይ: ${takenCards.length})\n\n`;
            for(let player in playerMap) {
                summary += `👤 ተጫዋች [${player}]: ካርቴላዎች ${playerMap[player].join(', ')}\n`;
            }

            alert(summary);
        }

        function leaveRoom() {
            if(myCards.length > 0) {
                if(!confirm("ከጨዋታው ከወጡ የያዟቸው ካርቴላዎች ይለቀቃሉ። እርግጠኛ ነዎት?")) {
                    return;
                }
                // Refund
                myBalance += myCards.length * currentRoomPrice;
                myCards.forEach(c => {
                    delete takenCardsMap[c];
                });
                delete playerMap[myUserId];
                myCards = [];
            }

            document.getElementById('user-balance').innerText = myBalance + " ETB";
            document.getElementById('p-game').classList.remove('active');
            document.getElementById('p-rooms').classList.add('active');
        }

        function refreshGrid() {
            updateGridVisuals();
            updateStatsAndDerash();
        }

        window.onload = initApp;
    </script>
</body>
</html>
