<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Bingo - Select Card</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 10px; font-size: 12px; text-align: center; }
.ticker { background: #450a0a; color: #fca5a5; padding: 6px; border-radius: 6px; margin-bottom: 8px; font-weight: bold; overflow: hidden; white-space: nowrap; font-size: 11px; }
.top-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: #161f30; padding: 6px; border-radius: 8px; margin-bottom: 8px; font-size: 10px; }
.top-box { background: #0f172a; padding: 4px 2px; border-radius: 4px; }
.top-box span { display: block; color: #38bdf8; font-weight: bold; font-size: 11px; }
.timer-box { background: #7c2d12; color: #fdba74; font-weight: bold; }
.selected-banner { background: #0284c7; padding: 6px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; color: #fff; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; text-align: left; font-size: 10px; }
.stat-box { background: #161f30; padding: 6px; border-radius: 6px; border: 1px solid #1e293b; }
.action-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.act-btn { background: #0284c7; border: none; color: white; padding: 8px 4px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
.btn-spectate { background: #581c87; }
.btn-shake { background: #eab308; color: #000; }
.cards-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 50px; }
.card-item { background: #15803d; color: white; padding: 8px 0; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
.card-item.taken { background: #dc2626; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 8px 0; font-size: 10px; color: #94a3b8; }
.nav-item.active { color: #38bdf8; font-weight: bold; }
</style>
</head>
<body>
<div class="ticker">🏆 ዮናስ 480 ETB አሸነፈ (ካርቴላ #45) • 🏆 ሰላም 960 ETB አሸነፈች</div>

<div class="top-bar">
  <div class="top-box">ዋሌት<span style="color:#4ade80;">100 ETB</span></div>
  <div class="top-box">ተጫዋቾች<span>1</span></div>
  <div class="top-box">ደራሽ ብር<span>0 ETB</span></div>
  <div class="top-box">Stake<span>5 ETB</span></div>
  <div class="top-box">የያዙት<span>0/6</span></div>
  <div class="top-box timer-box">ጊዜ<span id="timer-text" style="color:#f97316;">60 s</span></div>
</div>

<div class="selected-banner">የመረጧቸው ቁጥሮች፦ ምንም አልተመረጠም</div>

<div class="stats-grid">
  <div class="stat-box">
    <b style="color:#f97316;">🔥 የወጡ ቁጥሮች</b><br>
    ቁጥር #24፦ 78% (🔥 Hot)<br>
    ቁጥር #07፦ 65% (🔥 Hot)
  </div>
  <div class="stat-box">
    <b style="color:#fde047;">🏆 Lucky Cards</b><br>
    ካርቴላ #45፦ 3 ጊዜ አሸነፈ<br>
    ካርቴላ #112፦ 2 ጊዜ አሸነፈ
  </div>
</div>

<div class="action-btns">
  <button class="act-btn">🎲 ሲስተሙ ይምረጡ</button>
  <button class="act-btn btn-spectate">👁 Spectator</button>
  <button class="act-btn btn-shake">🔀 ሼክ አድርግ</button>
</div>

<div class="cards-grid" id="cards-container"></div>

<div class="bottom-nav">
  <div class="nav-item active">🎮<br>Game</div>
  <div class="nav-item">🕒<br>History</div>
  <div class="nav-item">👛<br>Wallet</div>
  <div class="nav-item">👤<br>Profile</div>
</div>

<script>
let timeLeft = 60;
const timerEl = document.getElementById("timer-text");
const container = document.getElementById("cards-container");

for (let i = 1; i <= 64; i++) {
  let btn = document.createElement("div");
  btn.className = "card-item";
  if ([5, 14, 23, 40, 55].includes(i)) btn.classList.add("taken");
  btn.innerText = i;
  btn.onclick = function() {
    this.classList.toggle("taken");
  };
  container.appendChild(btn);
}

setInterval(() => {
  if (timeLeft > 0) {
    timeLeft--;
    timerEl.innerText = timeLeft + " s";
  } else {
    location.href = "game.html";
  }
}, 1000);
</script>
</body>
</html>
